[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ostium-cli"
version = "0.1.0"
description = "CLI wrapper for Ostium decentralized perpetuals exchange"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ostium-python-sdk>=0.1.0",
    "typer[all]>=0.9.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
]

[project.scripts]
ostium = "ostium_cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ostium_cli"]
